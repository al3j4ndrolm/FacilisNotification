[versions]
agp = "9.4.1"
kotlin = "2.2.10"
startup = "1.2.0"
coreKtx = "1.19.1"
activity = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.02.01"
junit = "4.13.2"
orgJson = "20260814"
coroutines = "1.10.2"
facilisPermission = "1.0.0"
facilisStorage = "1.1.0"

[libraries]
androidx-startup = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
facilis-permission = { group = "com.github.al3j4ndrolm.FacilisPermission", name = "permission", version.ref = "facilisPermission" }
facilis-permission-compose = { group = "com.github.al3j4ndrolm.FacilisPermission", name = "permission-compose", version.ref = "facilisPermission" }
facilis-storage-compose = { group = "com.github.al3j4ndrolm.FacilisStorage", name = "storage-compose", version.ref = "facilisStorage" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
